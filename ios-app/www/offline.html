<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hardin Trips</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #faf8f4; color: #2a2520; font-family: -apple-system, system-ui, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 320px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #6b6259; line-height: 1.4; }
  button { background: #c06a3d; color: #fff; border: 0; border-radius: 10px; padding: 12px 28px; font-size: 17px; }
</style>
</head>
<body>
<main>
  <h1>Can't reach Hardin Trips</h1>
  <p>Check your internet connection and try again.</p>
  <button onclick="retry()">Try again</button>
</main>
<script>
  // Shown only when the app has never loaded the site on this phone (after
  // that, the offline cache opens it). Retry by itself once a connection returns.
  function retry() { location.href = 'https://ech-technicalsolutions.com/Trips/'; }
  window.addEventListener('online', retry);
</script>
</body>
</html>
